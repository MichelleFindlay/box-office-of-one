; box-office-of-one — debug / production switch for PHP-FPM / CGI hosts
;
; .htaccess php_value/php_flag directives are ignored under FPM or CGI
; (common on shared/cPanel hosting), so this file does the same job for
; those setups. PHP-FPM caches .user.ini for a few minutes
; (user_ini.cache_ttl, default 300s) — changes may take a moment to apply.
;
; Exactly one mode should be active below. To switch, comment out the
; active pair of lines (prefix with ";") and uncomment the other pair.

error_reporting = E_ALL
log_errors = On

; --- Mode: PRODUCTION (default) — log errors, don't show them ---
display_errors = Off
display_startup_errors = Off

; --- Mode: DEBUG — uncomment these two, comment out the two above ---
; display_errors = On
; display_startup_errors = On
